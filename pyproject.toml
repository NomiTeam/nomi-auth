[project]
name = "nomi-auth"
version = "0.1.0"
description = "Nomi account and Yggdrasil service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymysql[rsa]>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "cryptography>=44",
    "pillow>=11",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.11",
    "pyrefly>=1.4.1",
    "types-pymysql>=1.2.4.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
search-path = ["src"]
python-version = "3.12"
