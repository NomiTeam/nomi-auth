name: Auth tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install uv==0.12.23
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests
      - run: uv run pytest -q
